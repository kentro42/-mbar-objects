<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EFE6D4">
<title>Ambar Casa Violeta Azul — Álbum</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="stage" id="stage" aria-label="Álbum de Ambar Casa Violeta Azul">
  <div class="leaf" id="leaf">
    <section class="side front" id="frontSide" aria-label="Página actual del álbum" aria-hidden="false"></section>
    <section class="side back" id="backSide" aria-label="Página siguiente del álbum" aria-hidden="true" inert></section>
  </div>

  <section
    class="detail-overlay"
    id="overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="detailTitle"
    aria-describedby="detailDescription"
    aria-hidden="true"
    tabindex="-1"
  >
    <button class="overlay-close" id="closeBtn" type="button" aria-label="Cerrar detalle y volver al álbum">← Álbum</button>
    <div class="media" id="mediaBox" aria-label="Video de la pieza"></div>
    <div class="content" id="detailContent"></div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
